name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: test
        run: cargo test --all-features --locked
      - name: release build
        run: cargo build --release --locked
      - name: relay protocol and lease-fencing tests
        env:
          COORD_TEST_BIN: target/release/coord.exe
        run: node --test relay/relay.test.mjs relay/live-coord.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: coord-${{ matrix.os }}
          path: |
            target/release/coord
            target/release/coord.exe
          if-no-files-found: error
