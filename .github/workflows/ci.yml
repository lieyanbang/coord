name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: test
        run: cargo test --all-features --locked
      - name: release build
        run: cargo build --release --locked
      - name: health monitor authentication and recovery
        run: pwsh -NoProfile -File scripts/windows/test-coord-health-monitor.ps1 -CoordExe target/release/coord.exe
      - name: Dedicated low-privilege Action Runner rehearsal
        run: pwsh -NoProfile -File scripts/windows/test-action-runner.ps1 -BinaryDirectory target/release -EvidenceDirectory docs/verification/stage-r5-1b-low-privilege
      - name: Coord MCP test dependencies
        run: npm ci --prefix relay/coord-mcp --ignore-scripts --no-audit --no-fund
      - name: relay protocol and lease-fencing tests
        env:
          COORD_TEST_BIN: target/release/coord.exe
        run: node --test relay/relay.test.mjs relay/live-coord.test.mjs relay/logical-workers.test.mjs
      - name: Coord MCP OAuth and HTTP tests
        run: npm test --prefix relay/coord-mcp
      - name: Phase G request and result utility tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s scripts/phase_g -p test_phase_g_tools.py -v
      - name: Package matched R5-1B binaries and manifest
        shell: pwsh
        run: |
          $stage = 'target/r5-1b-artifact'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $names = @('coord.exe', 'coord-action-runner.exe', 'coord-emote-action.exe', 'coord-emote-action-v2.exe')
          $files = @()
          foreach ($name in $names) {
            $source = Join-Path 'target/release' $name
            $destination = Join-Path $stage $name
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "Missing release binary: $name" }
            Copy-Item -LiteralPath $source -Destination $destination
            $files += @{ name = $name; sha256 = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          $healthMonitorName = 'coord-health-monitor.ps1'
          $healthMonitorSource = Join-Path 'scripts/windows' $healthMonitorName
          $healthMonitorDestination = Join-Path $stage $healthMonitorName
          if (-not (Test-Path -LiteralPath $healthMonitorSource -PathType Leaf)) { throw 'Missing matched SYSTEM health monitor script.' }
          Copy-Item -LiteralPath $healthMonitorSource -Destination $healthMonitorDestination
          $healthMonitor = @{ name = $healthMonitorName; sha256 = (Get-FileHash -LiteralPath $healthMonitorDestination -Algorithm SHA256).Hash.ToLowerInvariant() }
          $zip = Join-Path $stage 'coord-r5-1b-windows-2022.zip'
          $artifactNames = @($names) + @($healthMonitorName)
          Compress-Archive -LiteralPath @($artifactNames | ForEach-Object { Join-Path $stage $_ }) -DestinationPath $zip -CompressionLevel Optimal
          $manifest = @{
            state = 'PASS'
            commit = (git rev-parse HEAD).Trim()
            platform = 'windows-2022-x86_64-pc-windows-msvc'
            files = $files
            health_monitor_script = $healthMonitor
            zip = @{ name = [IO.Path]::GetFileName($zip); sha256 = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $stage 'stage-r5-1b-artifacts.json') -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r5-1b-windows-low-privilege-evidence
          path: docs/verification/stage-r5-1b-low-privilege/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: coord-r5-1b-${{ matrix.os }}
          path: target/r5-1b-artifact/
          if-no-files-found: error
