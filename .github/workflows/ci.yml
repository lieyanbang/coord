name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: test
        run: cargo test --all-features --locked
      - name: release build
        run: cargo build --release --locked
      - name: health monitor authentication and recovery
        run: pwsh -NoProfile -File scripts/windows/test-coord-health-monitor.ps1 -CoordExe target/release/coord.exe
      - name: Dedicated low-privilege Action Runner rehearsal
        run: pwsh -NoProfile -File scripts/windows/test-action-runner.ps1 -BinaryDirectory target/release -EvidenceDirectory docs/verification/stage-g6-low-privilege
      - name: relay protocol and lease-fencing tests
        env:
          COORD_TEST_BIN: target/release/coord.exe
        run: node --test relay/relay.test.mjs relay/live-coord.test.mjs
      - name: Coord MCP test dependencies
        run: npm ci --prefix relay/coord-mcp --ignore-scripts --no-audit --no-fund
      - name: Coord MCP OAuth and HTTP tests
        run: npm test --prefix relay/coord-mcp
      - name: Phase G request and result utility tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s scripts/phase_g -p test_phase_g_tools.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g6-low-privilege-evidence
          path: docs/verification/stage-g6-low-privilege/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: coord-${{ matrix.os }}
          path: |
            target/release/coord
            target/release/coord.exe
            target/release/coord-action-runner.exe
            target/release/coord-emote-action.exe
          if-no-files-found: error
